<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Zenova Japan 積算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
/* Layout: 左に工程タブ＋明細表、右に常時見える見積サマリー（狭い画面では下に積む） */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1b2230; --muted:#3f4756; --line:#b9c0cb; --soft:#eceff4;
  --accent:#1f4e8c; --accent-ink:#ffffff; --steel:#33415c; --profit:#b8621b;
  --c1:#1f4e8c; --c2:#3f8f7a; --c3:#8a6bb8; --c4:#b8621b;
  --f-display:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans","Meiryo",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e6e9ef; --muted:#c2c9d4; --line:#2c3441; --soft:#222a35;
  --accent:#6f9fe0; --accent-ink:#0d1420; --steel:#aab6cc; --profit:#e39a5a;
  --c1:#6f9fe0; --c2:#5fbfa3; --c3:#b39ae0; --c4:#e39a5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e6e9ef; --muted:#c2c9d4; --line:#2c3441; --soft:#222a35;
  --accent:#6f9fe0; --accent-ink:#0d1420; --steel:#aab6cc; --profit:#e39a5a;
  --c1:#6f9fe0; --c2:#5fbfa3; --c3:#b39ae0; --c4:#e39a5a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{font-size:14px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.04em;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px;min-height:44px}
button:hover{border-color:var(--steel)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:#c0392b}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);letter-spacing:.06em;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:44px;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.steps button{border:0;border-radius:0;border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:transparent;position:relative}
.steps button:last-child{border-right:0}
.steps .no{font-family:var(--f-num);font-size:14px;color:var(--muted)}
.steps .nm{font-weight:700;font-size:18px}
.steps .amt{font-family:var(--f-num);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps button[aria-selected="true"]{background:var(--soft)}
.steps button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--sc)}
@media (max-width:860px){.steps{grid-template-columns:repeat(4,1fr)}.steps button:nth-child(4){border-right:0}.steps button:nth-child(-n+4){border-bottom:1px solid var(--line)}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.daysum{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.daysum .k{border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;min-width:120px}
.daysum .k small{font-size:14px;color:var(--muted)}
.daysum .k b{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.daysum .k.main{background:var(--soft);border-color:var(--steel)}
input::placeholder{color:var(--muted);opacity:.8}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sheet h2 span{font-size:15px;font-weight:400;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:14px;font-weight:500;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);letter-spacing:.05em;white-space:nowrap}
td{padding:5px 4px;border-bottom:1px solid var(--soft);vertical-align:middle}
td input,td select{padding:7px 8px}
td.num input,input.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.out{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px;font-weight:500}
tfoot td{border-bottom:0;padding-top:10px;font-weight:700}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.hint{font-size:15px;color:var(--muted)}
.mh{margin:4px 0 -4px;font-size:16px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.profit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;font-size:15px;padding:6px}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--panel)}
.inline{display:flex;align-items:center;gap:6px}
.inline input{max-width:110px}
aside.sum{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:900px){aside.sum{position:static}}
aside h2{margin:0;font-size:15px;letter-spacing:.16em;color:var(--muted);font-weight:500}
.bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.lines{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:16px}
.ln .sw{width:10px;height:10px;border-radius:2px}
.ln b{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums}
.ln.sub{border-bottom:1px solid var(--ink);font-weight:700}
.ln.sub b,.ln.tot b{font-weight:600}
.pct{font-size:14px;color:var(--muted);margin-left:4px}
.grand{background:var(--soft);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:2px}
.grand small{font-size:14px;color:var(--muted);letter-spacing:.1em}
.grand strong{font-family:var(--f-num);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.grand .tax{font-family:var(--f-num);font-size:15px;color:var(--muted)}
.chip{display:inline-block;font-size:14px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.warn{border-color:#c0392b;color:#c0392b}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
textarea#exportBox{width:100%;height:140px;font-family:var(--f-num);font-size:15px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.paper{background:#fff;color:#111;border:1px solid var(--line);padding:28px 30px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #111;padding-bottom:8px;gap:12px}
.pt-title{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.3em}
.pt-sub{font-size:16px;font-weight:700}
.pt-co{text-align:right;font-weight:700}.pt-co span{font-weight:400;font-size:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pgrid b{display:block;font-size:13px;color:#555;letter-spacing:.1em}
.ptotal{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;border:1.5px solid #111;padding:8px 12px}
.ptotal strong{font-family:var(--f-num);font-size:24px}
.pday{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;border-left:1px solid #999;padding-left:12px}
.pday b{font-family:var(--f-num);font-size:19px}.pday small{font-size:12px;color:#555}
.paper h4{margin:10px 0 0;font-size:16px;border-left:4px solid #111;padding-left:6px;display:flex;justify-content:space-between}
.paper h4 span{font-family:var(--f-num);font-weight:500}
table.pt{width:100%;min-width:0;border-collapse:collapse}
table.pt th,table.pt td{border:1px solid #999;padding:3px 6px;font-size:14px;color:#111}
table.pt th{background:#eee;font-weight:700;letter-spacing:0}
table.pt .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pnote{margin:0;font-size:14px}
.pstamp{display:flex;justify-content:flex-end;margin-top:10px}.pstamp div{width:64px;height:64px;border:1px solid #999;margin-left:-1px;text-align:center;font-size:13px;padding-top:2px}
.gwrap{overflow-x:auto}
table.gantt{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed;font-size:14px}
table.gantt th,table.gantt td{border:1px solid var(--line);padding:0;height:24px;text-align:center;font-weight:400;color:var(--ink)}
table.gantt .gl{width:190px;text-align:left;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.gantt .gd{width:48px;text-align:right;padding:0 4px;font-family:var(--f-num)}
table.gantt th{font-size:12px;font-family:var(--f-num);background:var(--soft)}
table.gantt .sun{color:#c0392b}table.gantt .sat{color:#2c6fbf}
table.gantt td.sun,table.gantt td.sat{background:var(--soft)}
table.gantt i{display:block;height:14px;margin:0 -1px}
.g-prep{background:var(--steel)}.g-work{background:var(--c1)}.g-spare{background:repeating-linear-gradient(45deg,var(--c4) 0 3px,transparent 3px 6px)}
.paper table.gantt th,.paper table.gantt td{border-color:#999;color:#111}
.paper table.gantt th,.paper table.gantt td.sun,.paper table.gantt td.sat{background:#eee}
.paper .g-prep{background:#555}.paper .g-work{background:#111}.paper .g-spare{background:repeating-linear-gradient(45deg,#111 0 2px,#fff 2px 5px)}
@media print{.gwrap{overflow:visible}table.gantt{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.elist{display:flex;flex-direction:column}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.erow .t{display:flex;flex-direction:column;min-width:0}
.erow .t b{overflow-wrap:anywhere}
.erow .t span{font-size:14px;color:var(--muted)}
.erow .p{font-family:var(--f-num);font-weight:700}
.erow .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.erow.cur{background:var(--soft)}
@media (max-width:560px){.erow{grid-template-columns:1fr}.erow .a{justify-content:flex-start}}
#pdfStage{position:fixed;left:-12000px;top:0;width:760px;background:#fff}
.custbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--soft);border-radius:8px;padding:10px 12px}
.cform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;border:1px solid var(--steel);border-radius:8px;padding:12px}
.cform .wide{grid-column:1/-1}
@page{size:A4 portrait;margin:12mm}
@media print{
  :root{color-scheme:light}
  .paper{font-size:13px}table.pt th,table.pt td{font-size:12.5px;padding:3px 5px}table.gantt th{font-size:10px}table.gantt .gl,table.gantt .gd{font-size:11.5px}
  body{background:#fff!important;padding:0!important}
  header.top,.steps,aside.sum,#exportSec,.screen-only,.toast{display:none!important}
  .main{display:block}.sheet{border:0;padding:0;background:#fff}
  .paper{border:0;padding:0;overflow:visible}
  table.pt tr{break-inside:avoid}.paper h4{break-after:avoid}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>ZENOVA JAPAN · ESTIMATE</small><h1>積算シート</h1></div>
    <div class="tools">
      <button class="primary" id="btnSave" hidden>見積を保存</button>
      <button id="btnList" hidden>保存した見積</button>
      <button id="btnCust" hidden>顧客リスト</button>
      <button id="btnCopy">表形式でコピー</button>
      <button id="btnText">見積サマリーをコピー</button>
      <span id="saveWrap" hidden></span>
      <span id="resetWrap"><button class="ghost" id="btnReset">新規（全消去）</button></span>
    </div>
  </header>


  <div class="main">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <nav class="steps" role="tablist" id="steps"></nav>
      <section class="sheet" id="sheet"></section>
    </div>
    <aside class="sum" aria-label="見積サマリー" id="sum"></aside>
  </div>
  <section class="sheet" id="listSec" hidden aria-label="保存した見積">
    <h2>保存した見積<span>保存・PDF出力のたびに新しい版として記録されます。行をクリックすると画面に読み込みます</span></h2>
    <div class="inline" style="max-width:420px"><input id="listQ" placeholder="管理番号・現場名・お客様で検索" aria-label="見積を検索"></div>
    <div id="listBody"><p class="hint">読み込み中…</p></div>
    <div class="row-actions"><span></span><button id="listClose">閉じる</button></div>
  </section>
  <section class="sheet" id="custSec" hidden aria-label="顧客リスト">
    <h2>顧客リスト<span>社内で共有されます。STEP 01 で選ぶと会社名・担当者などが入ります</span></h2>
    <div class="row-actions" style="justify-content:flex-start"><div class="inline" style="flex:1 1 280px;max-width:420px"><input id="custQ" placeholder="会社名・担当者・電話で検索" aria-label="顧客を検索"></div><button class="primary" id="custNew">＋ 顧客を登録</button></div>
    <div id="custForm" hidden></div>
    <div id="custBody"><p class="hint">読み込み中…</p></div>
    <div class="row-actions"><span></span><button id="custClose">閉じる</button></div>
  </section>
  <section class="sheet" id="exportSec" hidden>
    <h2>コピー用テキスト<span>コピーできない環境では、ここを選択してコピーしてください</span></h2>
    <textarea id="exportBox" readonly></textarea>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY='zenova-estimate-v3';
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const STEPS=[
  {id:'site',no:'01',name:'現場・顧客',color:'var(--steel)'},
  {id:'qty',no:'02',name:'数量・日数',color:'var(--steel)'},
  {id:'equip',no:'03',name:'機材',color:'var(--c1)'},
  {id:'labor',no:'04',name:'人工',color:'var(--c2)'},
  {id:'mat',no:'05',name:'材料費',color:'var(--c3)'},
  {id:'profit',no:'06',name:'利益',color:'var(--c4)'},
  {id:'print',no:'07',name:'積算シート',color:'var(--ink)'}
];
/* ケーシング径ごとの標準日当たり成果（箇所/日）— 仮の値。実績に合わせて変更してください */
const DIAS=[['800',2.5],['1000',2],['1200',1.5],['1500',1],['2000',0.7],['2500',0.5],['3000',0.4]];
/* 主要機材 */
const ROTS=[['RT-260',2600],['RT-200',2000],['RT-150',1500],['RT-120',1200]];
const CRANES=['BM1000','7120','BM1500','TK750GFS'];
const LENS=[['first','ファースト'],['l6','6m'],['l3','3m'],['l2','2m'],['l1','1m']];
const capOf=m=>(ROTS.find(x=>x[0]===m)||[0,0])[1];
const caseLen=r=>num(r.first)*num(S.main.firstLen)+6*num(r.l6)+3*num(r.l3)+2*num(r.l2)+num(r.l1);
const needDepth=d=>S.qty.filter(q=>String(q.dia)===String(d)).reduce((a,q)=>Math.max(a,num(q.depth)),0);
const maxDia=()=>S.qty.filter(q=>num(q.count)>0).reduce((a,q)=>Math.max(a,num(q.dia)),0);
const mainAmt={
  rot:r=>num(r.qty)*dayOf(r)*num(r.rate)+num(r.move),
  crane:r=>num(r.qty)*dayOf(r)*num(r.rate)+num(r.move),
  grab:r=>num(r.qty)*dayOf(r)*num(r.rate),
  casing:r=>caseLen(r)*dayOf(r)*num(r.rate)
};
const mainTotal=()=>Object.keys(mainAmt).reduce((a,k)=>a+S.main[k].reduce((b,r)=>b+mainAmt[k](r),0),0);
const stdPer=d=>(DIAS.find(x=>x[0]===String(d))||[0,1])[1];
const COLS={
  equip:[{k:'name',t:'機材名',w:'26%'},{k:'spec',t:'規格・能力',w:'16%'},{k:'qty',t:'台数',n:1},{k:'days',t:'日数',n:1,auto:1},{k:'rate',t:'日額単価',n:1},{k:'move',t:'回送・搬入費',n:1}],
  labor:[{k:'name',t:'職種',w:'24%'},{k:'note',t:'内容',w:'22%'},{k:'qty',t:'人数',n:1},{k:'days',t:'日数',n:1,auto:1},{k:'rate',t:'人工単価',n:1}],
  mat:[{k:'name',t:'品名',w:'26%'},{k:'spec',t:'規格',w:'18%'},{k:'qty',t:'数量',n:1},{k:'unit',t:'単位'},{k:'rate',t:'単価',n:1},{k:'loss',t:'ロス%',n:1}]
};
const dayOf=r=>String(r.days??'').trim()===''?schedule().total:num(r.days);
const amount={
  equip:r=>num(r.qty)*dayOf(r)*num(r.rate)+num(r.move),
  labor:r=>num(r.qty)*dayOf(r)*num(r.rate),
  mat:r=>num(r.qty)*(1+num(r.loss)/100)*num(r.rate)
};
const today=()=>new Date().toISOString().slice(0,10);
const sample=()=>({sample:true,step:'site',

/* 管理番号 = 基本番号（編集可） + "-" + 版（自動・編集不可）。例：ZJ-20261112-03 */
const pad2=n=>String(n).padStart(2,'0');
const splitNo=no=>{const m=String(no||'').match(/^(.*)-(\d{1,3})$/);return m?{base:m[1],ver:+m[2]}:{base:String(no||''),ver:0}};
const fullNo=(b,v)=>v>0?b+'-'+pad2(v):b;
const dateBase=()=>'ZJ-'+(S.site.date||today()).replace(/-/g,'');
function syncNo(){S.site.no=fullNo(S.site.base||'',S.site.ver||0)}
function genNo(){return dateBase()}   // 互換用
if(S.site.base==null){const t=S.site.no?splitNo(S.site.no):{base:dateBase(),ver:0};S.site.base=t.base;S.site.ver=t.ver;S.lineBase=t.ver?t.base:null;S.autoBase=!S.site.no}
syncNo();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function schedule(){
  const rows=S.qty.map(r=>{const c=num(r.count),p=num(r.per);return {...r,c,p,d:p>0?c/p:0}});
  const places=rows.reduce((a,r)=>a+r.c,0);
  const raw=rows.reduce((a,r)=>a+r.d,0);
  const spare=Math.ceil(raw*num(S.sched.spare)/100);
  const work=Math.ceil(raw)+spare;
  const total=work+num(S.sched.setup)+num(S.sched.demob);
  return {rows,places,raw,spare,work,total};
}
function calc(){
  const sc=schedule();
  const e=S.equip.reduce((a,r)=>a+amount.equip(r),0)+mainTotal();
  const l=S.labor.reduce((a,r)=>a+amount.labor(r),0);
  const m=S.mat.reduce((a,r)=>a+amount.mat(r),0);
  const man=S.labor.reduce((a,r)=>a+num(r.qty)*dayOf(r),0);
  const direct=e+l+m, oh=direct*num(S.profit.overhead)/100, cost=direct+oh;
  const rate=num(S.profit.rate)/100;
  let price=S.profit.mode==='margin'?(rate<1?cost/(1-rate):cost):cost*(1+rate);
  const unit=num(S.profit.round); if(unit>0)price=Math.floor(price/unit)*unit;
  const profit=price-cost, tax=price*num(S.profit.tax)/100;
  return {sc,e,l,m,man,direct,oh,cost,price,profit,tax,total:price+tax,margin:price?profit/price:0};
}
function stepAmt(id,c){return {site:S.client.company||'未入力',qty:c.sc.total+' 日',equip:yen(c.e),labor:yen(c.l),mat:yen(c.m),profit:yen(c.profit),print:'印刷用'}[id]}

function mainHtml(auto){
  const M=S.main, md=maxDia();
  const sel=(sec,i,k,opts,v)=>`<select id="m-${sec}-${i}-${k}" data-m="${sec}" data-k="${k}">${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${val}" ${String(v)===String(val)?'selected':''}>${lab}</option>`}).join('')}</select>`;
  const inp=(sec,i,k,v,ph='')=>`<td class="num"><input id="m-${sec}-${i}-${k}" data-m="${sec}" data-k="${k}" value="${esc(v)}" inputmode="decimal" ${ph?`placeholder="${ph}"`:''}></td>`;
  const dayPh='自動 '+auto;
  const diaOpts=DIAS.map(([d])=>[d,'φ'+Number(d).toLocaleString('ja-JP')]);
  const tail=(sec,i)=>`<td class="out" data-mo="${sec}-${i}"></td><td><button class="ghost" data-mdel="${sec}-${i}" aria-label="行を削除">×</button></td>`;

  const rot=M.rot.map((r,i)=>{const cap=capOf(r.model),ng=md&&cap<md;return `<tr data-i="${i}"><td>${sel('rot',i,'model',ROTS.map(x=>x[0]),r.model)}</td><td class="out" style="font-weight:400">${ng?`<span class="chip warn">φ${md.toLocaleString('ja-JP')}に非対応</span>`:'〜φ'+cap.toLocaleString('ja-JP')}</td>${inp('rot',i,'qty',r.qty)}${inp('rot',i,'days',r.days,dayPh)}${inp('rot',i,'rate',r.rate)}${inp('rot',i,'move',r.move)}${tail('rot',i)}</tr>`}).join('');
  const crane=M.crane.map((r,i)=>`<tr data-i="${i}"><td>${sel('crane',i,'model',CRANES,r.model)}</td>${inp('crane',i,'qty',r.qty)}${inp('crane',i,'days',r.days,dayPh)}${inp('crane',i,'rate',r.rate)}${inp('crane',i,'move',r.move)}${tail('crane',i)}</tr>`).join('');
  const grab=M.grab.map((r,i)=>`<tr data-i="${i}"><td>${sel('grab',i,'dia',diaOpts,r.dia)}</td>${inp('grab',i,'qty',r.qty)}${inp('grab',i,'days',r.days,dayPh)}${inp('grab',i,'rate',r.rate)}${tail('grab',i)}</tr>`).join('');
  const cas=M.casing.map((r,i)=>`<tr data-i="${i}"><td>${sel('casing',i,'dia',diaOpts,r.dia)}</td>${LENS.map(([k])=>inp('casing',i,k,r[k])).join('')}<td class="out" data-ml="${i}"></td>${inp('casing',i,'days',r.days,dayPh)}${inp('casing',i,'rate',r.rate)}<td class="out" data-mo="casing-${i}"></td><td style="white-space:nowrap"><button data-autocase="${i}" title="STEP 02の深さから構成を自動作成">自動</button><button class="ghost" data-mdel="casing-${i}" aria-label="行を削除">×</button></td></tr>`).join('');
  return `<h2>機材費<span>日数を空欄にすると全体工期 ${auto} 日が入ります</span>${sampleChip()}</h2>

function ganttHtml(c){
  const total=c.sc.total; if(!total)return '<p class="pnote">工期が 0 日です。STEP 02 を入力してください。</p>';
  const segs=[]; let t=0;
  const add=(name,len,cls)=>{if(len>0){segs.push({name,s:t,e:t+len,len,cls});t+=len}};
  add('準備・据付',num(S.sched.setup),'g-prep');
  const work=c.sc.rows.filter(r=>r.c>0&&r.d>0); const scale=work.length?Math.ceil(c.sc.raw)/c.sc.raw:1;
  work.forEach(r=>add('φ'+Number(r.dia).toLocaleString('ja-JP')+' 施工 '+r.c+'箇所',r.d*scale,'g-work'));
  add('予備日',c.sc.spare,'g-spare');
  add('撤去・片付け',num(S.sched.demob),'g-prep');
  const st=S.site.start?new Date(S.site.start+'T00:00:00'):null, W='日月火水木金土';
  const days=[...Array(total)].map((_,i)=>{if(!st)return {n:i+1};const d=new Date(st);d.setDate(d.getDate()+i);return {n:i+1,md:(d.getMonth()+1)+'/'+d.getDate(),w:W[d.getDay()],wd:d.getDay()}});
  const every=total>40?5:total>20?2:1, lab=i=>(i===0||(i+1)%every===0);
  const head=`<tr><th class="gl">工種</th><th class="gd">日数</th>${days.map((d,i)=>`<th class="${d.wd===0?'sun':d.wd===6?'sat':''}">${lab(i)?(st?d.md:d.n):''}</th>`).join('')}</tr>`+
    (st?`<tr><th class="gl"></th><th class="gd"></th>${days.map(d=>`<th class="${d.wd===0?'sun':d.wd===6?'sat':''}">${total<=31?d.w:''}</th>`).join('')}</tr>`:'');
  const body=segs.map(g=>`<tr><td class="gl">${esc(g.name)}</td><td class="gd">${Math.round(g.len*10)/10}</td>${days.map((d,i)=>`<td class="${d.wd===0?'sun':d.wd===6?'sat':''}">${(i<g.e-1e-9&&i+1>g.s+1e-9)?`<i class="${g.cls}"></i>`:''}</td>`).join('')}</tr>`).join('');
  return `<div class="gwrap"><table class="gantt"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <p class="pnote">${st?'着工 '+esc(S.site.start)+' から暦日で表示（休工日は含めていません）':'着工予定日を入れると日付で表示されます'}　全体工期 ${total}日</p>`;
}
function autoCase(i){
  const r=S.main.casing[i], d=needDepth(r.dia), fl=num(S.main.firstLen);
  if(!d){toast('STEP 02 に φ'+r.dia+' の深さが入っていません');return}
  let rem=Math.max(0,d-fl); const o={first:1,l6:0,l3:0,l2:0,l1:0};
  o.l6=Math.floor(rem/6); rem-=o.l6*6;
  if(rem>=3){o.l3=1;rem-=3} if(rem>1){o.l2=1;rem=Math.max(0,rem-2)} if(rem>0){o.l1=1}
  Object.entries(o).forEach(([k,v])=>r[k]=String(v)); S.sample=false; renderSheet();
  toast('φ'+r.dia+'：必要長 '+d+'m に合わせて構成しました');

  body.innerHTML='<div class="elist">'+rows.map(c=>{const n=custCount(c);return `<div class="erow ${c.id===S.client.custId?'cur':''}"><div class="t"><b>${esc(c.company||'（会社名なし）')}${c.dept?'　'+esc(c.dept):''}</b>
  <span>${c.person?esc(c.person)+' 様　':''}${c.tel?'TEL '+esc(c.tel)+'　':''}${c.email?esc(c.email)+'　':''}・　見積 ${n}件</span>${c.address||c.note?`<span>${esc(c.address||'')}${c.note?'　'+esc(c.note):''}</span>`:''}</div>
  <div class="a" data-row="${esc(c.id)}"><button class="primary" data-cuse="${esc(c.id)}">この見積に使う</button>${n?`<button data-chist="${esc(c.company||'')}">見積を見る</button>`:''}<button data-cedit="${esc(c.id)}">編集</button><button class="ghost" data-cdelask="${esc(c.id)}">削除</button></div></div>`}).join('')+'</div>';
}
function openCustForm(c){
  custEdit=c?c.id:'';const v=c||{};

  f.innerHTML=`<div class="cform"><b class="wide">${c?'顧客を編集':'顧客を登録'}</b>${CF.map(([k,l])=>`<label class="f ${k==='address'||k==='note'?'wide':''}">${l}<input id="cf_${k}" value="${esc(v[k]||'')}" ${k==='tel'?'type="tel"':k==='email'?'type="email"':''}></label>`).join('')}

async function writeCust(id,data){
  const ref=id?DB.collection('customers').doc(id):DB.collection('customers').doc();
  await ref.set({...data,updatedAt:new Date().toISOString()});
  return ref.id||ref.path.split('/').pop();
}
const custErr=e=>({'permission-denied':'顧客リストを変更する権限がありません。','resource-exhausted':'登録できる件数の上限です。'}[e&&e.code]||'保存できませんでした。もう一度お試しください。');
function useCust(id){
  const c=CUST.find(x=>x.id===id);if(!c)return;
  ['company','dept','person','tel','email','note'].forEach(k=>S.client[k]=c[k]||'');
  S.client.custId=c.id;S.sample=false;save();

}
const safeId=no=>{const t=String(no||'').trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').replace(/^\.+$/,'_').slice(0,120);return t||('est_'+Date.now().toString(36))};

function stopListeners(){UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[];LIST=[];CUST=[];listLoaded=custLoaded=false}
function startListeners(){
  stopListeners();
  const t2=setTimeout(()=>{if(!custLoaded)$('custBody').innerHTML='<p class="hint">顧客リストをまだ読み込めません。通信状況を確認してください。</p>'},10000);
  UNSUB.push(DB.collection('customers').orderBy('company','asc').limit(1000).onSnapshot(snap=>{

  UNSUB.push(DB.collection('estimates').orderBy('updatedAt','desc').limit(500).onSnapshot(snap=>{

}

  const fs=firebase.firestore();

})();
function recBase(r){return r.base!=null?r.base:splitNo(r.no).base}
function recVer(r){return r.ver!=null?+r.ver:splitNo(r.no).ver}
function maxVer(base){return LIST.filter(r=>recBase(r)===base).reduce((m,r)=>Math.max(m,recVer(r)),0)}
function genBase(){return dateBase()}
function verText(){return S.site.ver>0?'v'+pad2(S.site.ver):'未保存'}
function verNextText(){const b=(S.site.base||'').trim();if(!b)return '';const n=(DB?maxVer(b):S.site.ver||0)+1;return '次に保存すると v'+pad2(n)+'（'+fullNo(b,n)+'）'}
function updateVerView(){const v=$('site_ver');if(v)v.value=verText();const h=$('site_vernext');if(h)h.textContent=verNextText()}
function renderList(){
  const q=($('listQ').value||'').trim().toLowerCase();
  const rows=LIST.filter(r=>!q||[r.no,r.siteName,r.client].join(' ').toLowerCase().includes(q));
  if(!LIST.length){$('listBody').innerHTML='<p class="hint">保存した見積はまだありません。「見積を保存」または「PDFで保存」で記録されます。</p>';return}
  if(!rows.length){$('listBody').innerHTML='<p class="hint">該当する見積がありません。</p>';return}
  $('listBody').innerHTML='<div class="elist">'+rows.map(r=>{const v=recVer(r),latest=v===maxVer(recBase(r));return `<div class="erow ${r.id===S.docId?'cur':''}"><div class="t" data-open="${esc(r.id)}" role="button" tabindex="0" style="cursor:pointer" title="クリックで画面に読み込む"><b>${esc(recBase(r))} <span class="chip" style="margin-left:4px">v${pad2(v)}</span>${latest?'':' <span class="hint" style="font-weight:400">（旧版）</span>'}${r.via==='pdf'?' <span class="hint" style="font-weight:400">PDF出力</span>':''}　${esc(r.siteName||'（現場名なし）')}</b><span>${esc(r.client||'')}　・　<span class="p">${yen(r.price)}</span>　・　工期 ${num(r.days)}日　・　${esc(fmtDate(r.updatedAt))}</span></div>
  <div class="a" data-row="${esc(r.id)}"><button data-open="${esc(r.id)}">開く</button><button data-dup="${esc(r.id)}">複製</button><button class="ghost" data-delask="${esc(r.id)}">削除</button></div></div>`}).join('')+'</div>';
}
const fmtDate=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function snapshotState(){const o=JSON.parse(JSON.stringify(S));delete o.docId;delete o.step;delete o.sample;delete o.lineBase;delete o.autoBase;return o}
let PENDING_VIA='save', SAVING=false;
async function saveEstimate(force,via='save'){
  if(!DB){toast('データベースに接続していません');return false}
  const base=(S.site.base||'').trim();
  if(!base){toast('STEP 01 で管理番号を入れてください');go('site');return false}
  if(!/^[A-Za-z0-9_.~:@+\-]{1,60}$/.test(base)){toast('管理番号は半角英数字と - _ . のみ、60文字以内にしてください');go('site');return false}
  if(!force&&base!==S.lineBase&&maxVer(base)>0){
    PENDING_VIA=via;
    $('saveWrap').hidden=false;$('saveWrap').innerHTML=`<span class="confirm">管理番号「${esc(base)}」は既に v${pad2(maxVer(base))} まであります。その続き（v${pad2(maxVer(base)+1)}）として保存しますか？ <button class="primary" id="saveOver">続きとして保存</button><button id="saveCancel">やめる</button></span>`;return false}
  const c=calc();
  const btn=$('btnSave');btn.disabled=true;btn.textContent='保存中…';
  const col=DB.collection('estimates');
  SAVING=true;
  try{
    let v=Math.max(maxVer(base),0)+1, id, ref;
    await DB.runTransaction(async tx=>{
      for(let i=0;i<50;i++){id=safeId(fullNo(base,v));ref=col.doc(id);const snap=await tx.get(ref);if(!snap.exists)break;v++}
      const st=snapshotState();st.site.base=base;st.site.ver=v;st.site.no=fullNo(base,v);
      tx.set(ref,{no:fullNo(base,v),base,ver:v,via,siteName:S.site.name||'',client:S.client.company||'',price:Math.round(c.price),days:c.sc.total,updatedAt:new Date().toISOString(),state:st});
    });
    S.site.base=base;S.site.ver=v;syncNo();S.lineBase=base;S.autoBase=false;S.docId=id;save();{const f=$('site_base');if(f)f.value=base}
    updateVerView();renderSteps(calc());
    toast('保存しました（'+S.site.no+'）');return true;
  }catch(e){
    const m={'permission-denied':'保存できませんでした（入力内容が保存の条件を満たしていません）。','resource-exhausted':'Firestore の利用上限に達しました。時間をおいてお試しください。','unavailable':'オフラインのため保存できません。接続を確認してください。','failed-precondition':'オフラインのため保存できません。接続を確認してください。'}[e&&e.code]||'保存できませんでした。時間をおいてもう一度お試しください。';
    toast(m);return false;
  }finally{SAVING=false;btn.disabled=false;btn.textContent='見積を保存';$('saveWrap').hidden=true}
}
function loadEstimate(id,dup){
  const r=LIST.find(x=>x.id===id);if(!r||!r.state)return;
  const cur=S.step||'site';
  S={...blank(),...JSON.parse(JSON.stringify(r.state))};S.sample=false;
  if(S.site.base==null){const t=splitNo(S.site.no);S.site.base=t.base;S.site.ver=t.ver}
  if(dup){S.docId=undefined;S.site.date=today();S.site.base=genBase();S.site.ver=0;S.lineBase=null;S.autoBase=true}
  else{S.docId=id;S.site.base=recBase(r);S.site.ver=recVer(r);S.lineBase=S.site.base;S.autoBase=false}
  syncNo();
  $('listSec').hidden=true;go(dup?'site':cur);
  toast(dup?'複製しました（新しい管理番号 '+S.site.base+'）':'「'+fullNo(recBase(r),recVer(r))+'」を読み込みました');
}
function nextNo(no){const m=String(no||'').match(/^(.*?)(\d+)$/);let cand=m?m[1]+String(+m[2]+1).padStart(m[2].length,'0'):(no||'ZJ')+'-2';
  while(LIST.some(r=>r.no===cand)){const k=cand.match(/^(.*?)(\d+)$/);cand=k[1]+String(+k[2]+1).padStart(k[2].length,'0')}return cand}
document.addEventListener('click',async e=>{
  const row=e.target.closest('div[data-open]');if(row&&!e.target.closest('button')){loadEstimate(row.dataset.open,false);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='btnSave'){saveEstimate(false);return}
  if(b.id==='saveOver'){const via=PENDING_VIA;if(await saveEstimate(true,via)&&via==='pdf'){renderSheet();makePdf($('btnPdf'))}return}
  if(b.id==='saveCancel'){$('saveWrap').hidden=true;return}
  if(b.id==='btnList'){$('listSec').hidden=!$('listSec').hidden;if(!$('listSec').hidden){renderList();$('listSec').scrollIntoView({block:'start'})}return}
  if(b.id==='listClose'){$('listSec').hidden=true;return}
  if(b.dataset.open){loadEstimate(b.dataset.open,false);return}
  if(b.dataset.dup){loadEstimate(b.dataset.dup,true);return}
  if(b.dataset.delask){const w=b.closest('[data-row]');w.innerHTML=`<span class="confirm">削除しますか？ <button class="primary" data-delyes="${esc(b.dataset.delask)}">削除する</button><button id="delNo">やめる</button></span>`;return}
  if(b.id==='delNo'){renderList();return}
  if(b.dataset.delyes){try{await DB.collection('estimates').doc(b.dataset.delyes).delete();if(S.docId===b.dataset.delyes){S.docId=undefined;save()}toast('削除しました')}catch(err){toast('削除できませんでした');renderList()}return}
  if(b.id==='btnPdf'){if(!DB){makePdf(b);return}if(await saveEstimate(false,'pdf')){renderSheet();makePdf($('btnPdf'))}return}
  if(b.id==='btnCust'){$('custSec').hidden=!$('custSec').hidden;if(!$('custSec').hidden){renderCust();$('custSec').scrollIntoView({block:'start'})}return}
  if(b.id==='custClose'){$('custSec').hidden=true;$('custForm').hidden=true;return}
  if(b.id==='custNew'){openCustForm(null);return}
  if(b.dataset.cedit){openCustForm(CUST.find(c=>c.id===b.dataset.cedit));return}
  if(b.id==='cfCancel'){$('custForm').hidden=true;return}
  if(b.id==='cfSave'){
    const d={};CF.forEach(([k])=>d[k]=$('cf_'+k).value.trim());
    if(!d.company){toast('会社名を入れてください');$('cf_company').focus();return}
    if(!custEdit&&CUST.some(c=>c.company===d.company&&(c.person||'')===d.person)){toast('同じ会社・担当者がすでに登録されています');return}
    b.disabled=true;
    try{await writeCust(custEdit,d);$('custForm').hidden=true;toast(custEdit?'顧客を更新しました':'顧客を登録しました')}catch(err){toast(custErr(err))}finally{b.disabled=false}
    return}
  if(b.dataset.cuse){useCust(b.dataset.cuse);$('custSec').hidden=true;if(S.step!=='site')go('site');return}
  if(b.dataset.chist){$('custSec').hidden=true;$('listSec').hidden=false;$('listQ').value=b.dataset.chist;renderList();$('listSec').scrollIntoView({block:'start'});return}
  if(b.dataset.cdelask){const w=b.closest('[data-row]');w.innerHTML=`<span class="confirm">この顧客を削除しますか？（保存した見積は消えません） <button class="primary" data-cdelyes="${esc(b.dataset.cdelask)}">削除する</button><button id="cdelNo">やめる</button></span>`;return}
  if(b.id==='cdelNo'){renderCust();return}
  if(b.dataset.cdelyes){try{await DB.collection('customers').doc(b.dataset.cdelyes).delete();if(S.client.custId===b.dataset.cdelyes){delete S.client.custId;save()}toast('顧客を削除しました')}catch(err){toast(custErr(err));renderCust()}return}
  if(b.id==='custSaveCur'){
    const d={company:S.client.company||'',dept:S.client.dept||'',person:S.client.person||'',tel:S.client.tel||'',email:S.client.email||'',note:S.client.note||''};
    if(!d.company){toast('会社名を入れてください');return}
    const ex=CUST.find(c=>c.id===S.client.custId);
    if(ex)d.address=ex.address||'';
    b.disabled=true;
    try{const id=await writeCust(ex?ex.id:'',d);S.client.custId=id;save();refreshPick();toast(ex?'顧客リストを更新しました':'顧客リストに登録しました')}catch(err){toast(custErr(err))}finally{b.disabled=false}
    return}
});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('[data-open][role=button]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click()}});
document.addEventListener('input',e=>{if(e.target.id==='listQ')renderList();if(e.target.id==='custQ')renderCust()});
document.addEventListener('change',e=>{if(e.target.id==='custPick'&&e.target.value&&e.target.value!==S.client.custId)useCust(e.target.value)});

/* ===== PDF保存 ===== */

async function makePdf(btn){
  if(!window.html2canvas||!window.jspdf){toast('PDF作成の準備ができていません。ページを再読み込みしてください');return}
  const paper=document.querySelector('.paper');if(!paper)return;
  btn.disabled=true;btn.textContent='PDFを作成中…';
  const stage=document.createElement('div');stage.id='pdfStage';
  const clone=paper.cloneNode(true);clone.style.border='0';clone.style.overflow='visible';stage.appendChild(clone);document.body.appendChild(stage);
  try{
    await document.fonts?.ready;
    const SC=2, canvas=await html2canvas(clone,{scale:SC,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:900});
    const pxW=canvas.width, pageW=210, pageH=297, mg=10, cw=pageW-mg*2, chMm=pageH-mg*2;
    const pagePx=Math.floor(pxW*chMm/cw);
    const base=clone.getBoundingClientRect().top;
    const cuts=[...clone.querySelectorAll('tr,h4,.pnote,.ptotal,.pgrid,.pstamp,.gwrap,header')].map(el=>Math.round((el.getBoundingClientRect().top-base)*SC)).filter(v=>v>0).sort((a,b)=>a-b);
    const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    let y=0, page=0;
    while(y<canvas.height-2){
      let end=Math.min(y+pagePx,canvas.height);
      if(end<canvas.height){const c=cuts.filter(v=>v>y+pagePx*0.5&&v<=end);if(c.length)end=c[c.length-1]}
      const part=document.createElement('canvas');part.width=pxW;part.height=end-y;
      const ctx=part.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,pxW,part.height);ctx.drawImage(canvas,0,y,pxW,end-y,0,0,pxW,end-y);
      if(page)pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',mg,mg,cw,(end-y)*cw/pxW);
      pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(String(S.site.no||'')+'  '+(page+1),pageW-mg,pageH-4,{align:'right'});
      y=end;page++;
    }
    const fname=('積算書_'+(S.site.no||'')+'_'+(S.site.name||'')).replace(/[\\/:*?"<>|]/g,'_').slice(0,120)+'.pdf';
    const data=pdf.output('arraybuffer');
    const url=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));
    const link=document.createElement('a');link.href=url;link.download=fname;document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);toast('PDFを保存しました（'+S.site.no+' を記録済み）');
  }catch(e){toast('PDFを作成できませんでした')}
  finally{stage.remove();btn.disabled=false;btn.textContent='PDFで保存'}
}
go(S.step||'site');
